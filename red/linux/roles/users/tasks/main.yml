---
- name: Create all required groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ groups }}"
  ignore_errors: no

- name: Create users
  ansible.builtin.user:
    name: "{{ item.username }}"
    password: "{{ item.password | password_hash('sha512') }}"
    groups: "{{ item.groups | default(omit) }}"
    state: present
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
  ignore_errors: no

- name: Ensure home directories exist
  ansible.builtin.file:
    path: "/home/{{ item.username }}"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
  ignore_errors: no

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: "/home/{{ item.username }}/.ssh"
    state: directory
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: '0700'
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
  ignore_errors: no

- name: Replace authorized keys with our ssh key for all users
  ansible.builtin.copy:
    src: ~/.ssh/key.pub
    dest: "/home/{{ item.username }}/.ssh/authorized_keys"
    owner: "{{ item.username }}"
    group: "{{ item.username }}"
    mode: '0600'
  loop: "{{ users }}"
  loop_control:
    label: "{{ item.username }}"
  ignore_errors: no

- name: Add NOPASSWD sudo permissions for all groups
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    create: no
    line: "%{{ item }} ALL=(ALL) NOPASSWD: ALL"
    validate: 'visudo -cf %s'
  loop: "{{ groups }}"
