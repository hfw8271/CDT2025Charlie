- name: Install DNS Server Role
  ansible.windows.win_feature:
    name: DNS
    state: present
    include_management_tools: yes
  register: dns_install

- name: Reboot after installing DNS Server Role
  ansible.windows.win_reboot:
  when: dns_install.changed


- name: Check if jurassicpark.local zone exists
  community.windows.win_dns_zone_info:
    name: jurassicpark.local
  register: jurassic_zone_info
  ignore_errors: yes

- name: Create Forward Lookup Zone
  community.windows.win_dns_zone:
    name: jurassicpark.local
    zone_type: Primary
  when: jurassic_zone_info.failed

- name: Create A record for Plesiosaurus1
  community.windows.win_dns_record:
    name: plesiosaurus1
    type: A
    value: 10.0.1.43
    zone: jurassicpark.local
    state: present

- name: Create A record for Plesiosaurus2
  community.windows.win_dns_record:
    name: plesiosaurus2
    type: A
    value: 10.0.2.43
    zone: jurassicpark.local
    state: present

- name: Check if 1.0.10.in-addr.arpa zone exists
  community.windows.win_dns_zone_info:
    name: 1.0.10.in-addr.arpa
  register: reverse_zone_info_1
  ignore_errors: yes

- name: Create Reverse Lookup Zone for 10.0.1.0/24
  community.windows.win_dns_zone:
    name: 1.0.10.in-addr.arpa
    zone_type: Primary
    dynamic_update: "None"
    replication: "Domain"
  when: reverse_zone_info_1.failed
    
- name: Check if 2.0.10.in-addr.arpa reverse zone exists
  community.windows.win_dns_zone_info:
    name: 2.0.10.in-addr.arpa
  register: reverse_zone_info_2
  ignore_errors: yes

- name: Create Reverse Lookup Zone for 10.0.2.0/24
  community.windows.win_dns_zone:
    name: 2.0.10.in-addr.arpa
    zone_type: Primary
    dynamic_update: "None"
    replication: "Domain"
  when: reverse_zone_info_2.failed

- name: Create PTR record for Plesiosaurus1
  community.windows.win_dns_record:
    name: 43
    type: PTR
    value: plesiosaurus1.jurassicpark.local
    zone: 1.0.10.in-addr.arpa
    state: present

- name: Create PTR record for Plesiosaurus2
  community.windows.win_dns_record:
    name: 43
    type: PTR
    value: plesiosaurus2.jurassicpark.local
    zone: 2.0.10.in-addr.arpa
    state: present
