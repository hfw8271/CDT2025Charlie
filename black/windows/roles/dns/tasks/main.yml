- name: Install DNS Server Role
  ansible.windows.win_feature:
    name: DNS
    state: present
    include_management_tools: yes
  register: dns_install

- name: Reboot after installing DNS Server Role
  ansible.windows.win_reboot:
  when: dns_install.changed

# --- Forward Lookup Zone ---
- name: Create Forward Lookup Zone
  community.windows.win_dns_zone:
    name: jurassicpark.local
    type: Primary
  ignore_errors: yes

# --- A Records ---
- name: Create A record for tyrannosaurus1
  community.windows.win_dns_record:
    name: tyrannosaurus1
    type: A
    value: 10.0.1.9
    zone: jurassicpark.local
    state: present
  ignore_errors: yes

- name: Create A record for tyrannosaurus2
  community.windows.win_dns_record:
    name: tyrannosaurus2
    type: A
    value: 10.0.2.9
    zone: jurassicpark.local
    state: present
  ignore_errors: yes

# --- Reverse Lookup Zones ---
- name: Create Reverse Lookup Zone for 10.0.1.0/24
  community.windows.win_dns_zone:
    name: 1.0.10.in-addr.arpa
    type: Primary
  ignore_errors: yes

- name: Create Reverse Lookup Zone for 10.0.2.0/24
  community.windows.win_dns_zone:
    name: 2.0.10.in-addr.arpa
    type: Primary
  ignore_errors: yes

# --- PTR Records ---
- name: Create PTR record for tyrannosaurus1
  community.windows.win_dns_record:
    name: 43
    type: PTR
    value: tyrannosaurus1.jurassicpark.local
    zone: 1.0.10.in-addr.arpa
    state: present
  ignore_errors: yes

- name: Create PTR record for tyrannosaurus2
  community.windows.win_dns_record:
    name: 43
    type: PTR
    value: tyrannosaurus2.jurassicpark.local
    zone: 2.0.10.in-addr.arpa
    state: present
  ignore_errors: yes

