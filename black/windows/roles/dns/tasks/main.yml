- name: Install DNS Server Role
  ansible.windows.win_feature:
    name: DNS
    state: present
    include_management_tools: yes
  register: dns_install

- name: Reboot after installing DNS Server Role
  ansible.windows.win_reboot:
  when: dns_install.changed

# ---------------- Forward Zone ----------------

- name: Check if jurassicpark.local zone exists
  community.windows.win_dns_zone:
    name: jurassicpark.local
    state: query
  register: forward_zone_info
  ignore_errors: true

- name: Create Forward Lookup Zone if missing
  community.windows.win_dns_zone:
    name: jurassicpark.local
    type: primary
    dynamic_update: none
    replication: domain
    state: present
  when: forward_zone_info.failed

# ---------------- A Records ----------------

- name: Create A record for Plesiosaurus1
  community.windows.win_dns_record:
    name: plesiosaurus1
    type: A
    value: 10.0.1.43
    zone: jurassicpark.local
    state: present

- name: Create A record for Plesiosaurus2
  community.windows.win_dns_record:
    name: plesiosaurus2
    type: A
    value: 10.0.2.43
    zone: jurassicpark.local
    state: present

# ---------------- Reverse Zone for 10.0.1.0/24 ----------------

- name: Check if reverse zone 1.0.10.in-addr.arpa exists
  community.windows.win_dns_zone:
    name: 1.0.10.in-addr.arpa
    state: query
  register: reverse_zone_info_1
  ignore_errors: true

- name: Create Reverse Lookup Zone for 10.0.1.0/24 if missing
  community.windows.win_dns_zone:
    name: 1.0.10.in-addr.arpa
    type: primary
    dynamic_update: none
    replication: domain
    state: present
  when: reverse_zone_info_1.failed

# ---------------- Reverse Zone for 10.0.2.0/24 ----------------

- name: Check if reverse zone 2.0.10.in-addr.arpa exists
  community.windows.win_dns_zone:
    name: 2.0.10.in-addr.arpa
    state: query
  register: reverse_zone_info_2
  ignore_errors: true

- name: Create Reverse Lookup Zone for 10.0.2.0/24 if missing
  community.windows.win_dns_zone:
    name: 2.0.10.in-addr.arpa
    type: primary
    dynamic_update: none
    replication: domain
    state: present
  when: reverse_zone_info_2.failed

# ---------------- PTR Records ----------------

- name: Create PTR record for Plesiosaurus1
  community.windows.win_dns_record:
    name: 43
    type: PTR
    value: plesiosaurus1.jurassicpark.local
    zone: 1.0.10.in-addr.arpa
    state: present

- name: Create PTR record for Plesiosaurus2
  community.windows.win_dns_record:
    name: 43
    type: PTR
    value: plesiosaurus2.jurassicpark.local
    zone: 2.0.10.in-addr.arpa
    state: present
