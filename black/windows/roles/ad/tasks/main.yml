- name: Install AD-Domain-Services
  ansible.windows.win_feature:
    name: AD-Domain-Services
    state: present
    include_management_tools: yes
  register: ad_ds_install

- name: Reboot after installing AD-Domain-Services
  ansible.windows.win_reboot:
  when: ad_ds_install.changed

- name: Promote Plesiosaurus to Domain Controller
  microsoft.ad.domain:
    dns_domain_name: jurassicpark.local
    domain_netbios_name: jurassicpark
    safe_mode_password: JurassicParkDSRM@2025
  register: promote

- name: Reboot after domain promotion
  ansible.windows.win_reboot:
  when: promote.changed

- name: Create local users on Plesiosaurus
  ansible.windows.win_user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    state: present
  loop: "{{ jurassic_users }}"

- name: Create AD users on Plesiosaurus
  microsoft.ad.user:
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    state: present
    path: "OU=Users,DC=jurassicpark,DC=local"
    enabled: yes
    groups: "{{ 'Domain Admins' if item.admin else '' }}"
  loop: "{{ jurassic_users }}"
