---
- name: Update APT package index
  apt:
    update_cache: yes

- name: Install Dovecot
  apt:
    name:
      - dovecot-core
      - dovecot-imapd
      - dovecot-pop3d
    state: present

- name: Ensure user exists for email
  user:
    name: "{{ thunderbird_username }}"
    password: "{{ thunderbird_password | password_hash('sha512') }}"
    shell: /bin/false
    state: present

- name: Verify user password is set correctly
  shell: "grep '{{ thunderbird_username }}' /etc/shadow"
  register: shadow_entry
  changed_when: false
  check_mode: no

- name: Display user password entry (hash only)
  debug:
    msg: "User has password set: {{ 'yes' if shadow_entry.stdout|length > 0 else 'no' }}"

- name: Create Maildir for the user
  file:
    path: "/home/{{ thunderbird_username }}/Maildir"
    state: directory
    owner: "{{ thunderbird_username }}"
    group: "{{ thunderbird_username }}"
    mode: '0700'
    recurse: yes

- name: Configure Dovecot main configuration
  copy:
    dest: /etc/dovecot/dovecot.conf
    content: |
      # Basic Dovecot configuration
      protocols = imap pop3
      mail_location = maildir:/home/{{ thunderbird_username }}/Maildir
      disable_plaintext_auth = no
      auth_mechanisms = plain login
      ssl = no
      auth_verbose = yes
      
      # Include auth config
      !include conf.d/10-auth.conf
      !include conf.d/10-mail.conf
      
      # Define passdb here as well to ensure it's loaded
      passdb {
        driver = passwd-file
        args = /etc/dovecot/users
      }
      userdb {
        driver = static
        args = uid={{ thunderbird_username }} gid={{ thunderbird_username }} home=/home/{{ thunderbird_username }}/Maildir
      }
    owner: root
    group: root
    mode: '0644'

- name: Configure Dovecot authentication
  copy:
    dest: /etc/dovecot/conf.d/10-auth.conf
    content: |
      # Authentication configuration
      disable_plaintext_auth = no
      auth_mechanisms = plain login
      passdb {
        driver = passwd-file
        args = scheme=PLAIN /etc/dovecot/users
      }
      userdb {
        driver = static
        args = uid={{ thunderbird_username }} gid={{ thunderbird_username }} home=/home/{{ thunderbird_username }}/Maildir
      }
    owner: root
    group: dovecot
    mode: '0640'

- name: Configure Dovecot mailbox location
  copy:
    dest: /etc/dovecot/conf.d/10-mail.conf
    content: |
      # Mailbox configuration
      mail_location = maildir:/home/{{ thunderbird_username }}/Maildir
      namespace inbox {
        inbox = yes
      }
    owner: root
    group: root
    mode: '0644'

- name: Create Dovecot PAM configuration
  copy:
    dest: /etc/pam.d/dovecot
    content: |
      # PAM configuration for Dovecot
      auth    required    pam_unix.so
      account required    pam_unix.so
    owner: root
    group: root
    mode: '0644'

- name: Create Dovecot passwd-file
  copy:
    dest: /etc/dovecot/users
    content: |
      {{ thunderbird_username }}:{PLAIN}{{ thunderbird_password }}
    owner: root
    group: dovecot
    mode: '0640'
  notify: restart dovecot

- name: Ensure proper permissions on dovecot users file
  file:
    path: /etc/dovecot/users
    owner: root
    group: dovecot
    mode: '0640'
  register: dovecot_users_perms

- name: Debug dovecot users file permissions
  debug:
    msg: "Current permissions: {{ dovecot_users_perms }}"

- name: Fix inconsistent home directory path in dovecot.conf
  replace:
    path: /etc/dovecot/dovecot.conf
    regexp: 'home=/home/%u/Maildir'
    replace: 'home=/home/{{ thunderbird_username }}/Maildir'

- name: Ensure dovecot can read its configuration files
  file:
    path: "{{ item }}"
    owner: root
    group: dovecot
    mode: '0640'
  with_items:
    - /etc/dovecot/dovecot.conf
    - /etc/dovecot/conf.d/10-auth.conf
    - /etc/dovecot/conf.d/10-mail.conf

- name: Create dovecot user's Maildir subdirectories
  file:
    path: "/home/{{ thunderbird_username }}/Maildir/{{ item }}"
    state: directory
    owner: "{{ thunderbird_username }}"
    group: "{{ thunderbird_username }}"
    mode: '0700'
  with_items:
    - 'new'
    - 'cur'
    - 'tmp'

- name: Restart Dovecot to apply changes
  service:
    name: dovecot
    state: restarted

