---
- name: Install and configure Postfix
  hosts: all
  become: yes
  vars:
    postfix_hostname: "{{ thunderbird_username }}.{{ email_domain }}"
    postfix_domain: "{{ email_domain }}"
    postfix_user: "{{ thunderbird_username }}"
    postfix_password: "{{ thunderbird_password }}"
  tasks:
    - name: Update APT package index
      apt:
        update_cache: yes

    - name: Install Postfix
      apt:
        name: postfix
        state: present

    - name: Configure Postfix main.cf
      copy:
        dest: /etc/postfix/main.cf
        content: |
          # Basic Postfix configuration
          myhostname = {{ postfix_hostname }}
          mydomain = {{ postfix_domain }}
          myorigin = $mydomain
          inet_interfaces = all
          mydestination = $myhostname, localhost.$mydomain, localhost
          relayhost =
          mailbox_size_limit = 0
          recipient_delimiter = +
          inet_protocols = all
          home_mailbox = Maildir/
        owner: root
        group: root
        mode: '0644'

    - name: Create Maildir for the user
      file:
        path: "/home/{{ postfix_user }}/Maildir"
        state: directory
        owner: "{{ postfix_user }}"
        group: "{{ postfix_user }}"
        mode: '0700'
        recurse: yes

    - name: Restart Postfix to apply changes
      service:
        name: postfix
        state: restarted

    - name: Ensure user exists for email
      user:
        name: "{{ postfix_user }}"
        password: "{{ postfix_password | password_hash('sha512') }}"
        shell: /bin/false