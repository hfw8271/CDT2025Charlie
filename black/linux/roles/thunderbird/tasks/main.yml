---
- name: Update APT package index
  apt:
    update_cache: yes

- name: Install Dovecot
  apt:
    name:
      - dovecot-core
      - dovecot-imapd
      - dovecot-pop3d
    state: present

- name: Configure Dovecot main configuration
  copy:
    dest: /etc/dovecot/dovecot.conf
    content: |
      # Basic Dovecot configuration
      protocols = imap pop3
      mail_location = maildir:/home/{{ thunderbird_user }}/Maildir
      disable_plaintext_auth = no
      auth_mechanisms = plain login
      ssl = no
    owner: root
    group: root
    mode: '0644'

- name: Configure Dovecot authentication
  copy:
    dest: /etc/dovecot/conf.d/10-auth.conf
    content: |
      # Authentication configuration
      disable_plaintext_auth = no
      auth_mechanisms = plain login
      passdb {
        driver = pam
      }
      userdb {
        driver = passwd
      }
    owner: root
    group: root
    mode: '0644'

- name: Configure Dovecot mailbox location
  copy:
    dest: /etc/dovecot/conf.d/10-mail.conf
    content: |
      # Mailbox configuration
      mail_location = maildir:/home/{{ thunderbird_user }}/Maildir
      namespace inbox {
        inbox = yes
      }
    owner: root
    group: root
    mode: '0644'

- name: Create Maildir for the user
  file:
    path: "/home/{{ thunderbird_user }}/Maildir"
    state: directory
    owner: "{{ thunderbird_user }}"
    group: "{{ thunderbird_user }}"
    mode: '0700'
    recurse: yes

- name: Ensure user exists for email
  user:
    name: "{{ thunderbird_user }}"
    password: "{{ thunderbird_password | password_hash('sha512') }}"
    shell: /bin/false

- name: Restart Dovecot to apply changes
  service:
    name: dovecot
    state: restartedx`