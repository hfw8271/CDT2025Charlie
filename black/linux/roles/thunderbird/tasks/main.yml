- name: Update APT package index
  apt:
    update_cache: yes

- name: Install Thunderbird
  apt:
    name: thunderbird
    state: present

- name: Create Thunderbird configuration directory for a user
  file:
    path: "/home/john_hammon/.thunderbird"
    state: directory
    owner: "john_hammon"
    group: "john_hammon"
    mode: '0755'

- name: Ensure Thunderbird configuration directory exists
  file:
    path: "/home/john_hammon/.thunderbird"
    state: directory
    owner: "john_hammon"
    group: "john_hammon"
    mode: '0755'

- name: Deploy Thunderbird configuration (prefs.js)
  copy:
    dest: "/home/john_hammon/.thunderbird/prefs.js"
    content: |
      // Jurassic Park Themed Thunderbird Configuration File
      user_pref("mail.account.account1.server", "imap://imap.{{ email_domain }}");
      user_pref("mail.server.server1.hostname", "imap.{{ email_domain }}");
      user_pref("mail.server.server1.type", "imap");
      user_pref("mail.server.server1.userName", "{{ thunderbird_username }}@{{ email_domain }}");
      user_pref("mail.smtpserver.smtp1.hostname", "smtp.{{ email_domain }}");
      user_pref("mail.smtpserver.smtp1.username", "{{ thunderbird_username }}@{{ email_domain }}");
      user_pref("mail.smtpserver.smtp1.password", "{{ thunderbird_password }}");
      user_pref("mail.smtpserver.smtp1.authMethod", 1);
    owner: "john_hammon"
    group: "john_hammon"
    mode: '0644'


- name: Ensure autostart directory exists
  file:
    path: "/home/john_hammon/.config/autostart"
    state: directory
    owner: "john_hammon"
    group: "john_hammon"
    mode: '0755'

- name: Enable Thunderbird to start on login
  copy:
    dest: "/home/john_hammon/.config/autostart/thunderbird.desktop"
    content: |
      [Desktop Entry]
      Type=Application
      Name=Thunderbird
      Exec=thunderbird
      X-GNOME-Autostart-enabled=true
    owner: "john_hammon"
    group: "john_hammon"
    mode: '0644'


