- name: Set hostname based on team
  hostname:
    name: "{% if 'team01' in ansible_limit %}giganotosaurus1.jp1.local{% elif 'team02' in ansible_limit %}giganotosaurus2.jp2.local{% else %}unknown.local{% endif %}"

- name: Convert hostname to lowercase and set the hostname for team01
  hostname:
    name: "{{ item | lower }}1.jp1.local"
  when: "'team01' in ansible_limit"
  loop:
    - allosaurus
    - brachiosaurus
    - stegosaurus
    - triceratops

- name: Convert hostname to lowercase and set the hostname for team02
  hostname:
    name: "{{ item | lower }}2.jp2.local"
  when: "'team02' in ansible_limit"
  loop:
    - allosaurus
    - brachiosaurus
    - stegosaurus
    - triceratops