- name: Set hostname based on team
  hostname:
    name: "{% if 'team01' in ansible_limit %}giganotosaurus1.jp1.local{% elif 'team02' in ansible_limit %}giganotosaurus2.jp2.local{% else %}unknown.local{% endif %}"

- name: Set hostname for team01 machines
  hostname:
    name: "{{ inventory_hostname }}"
  when: "'team01' in ansible_limit"

- name: Set hostname for team02 machines
  hostname:
    name: "{{ inventory_hostname }}"
  when: "'team02' in ansible_limit"

- name: Set primary DNS server for team01
  lineinfile:
    path: /etc/resolv.conf
    state: present
    line: "nameserver 10.0.1.1"
  when: "'team01' in ansible_limit"

- name: Set primary DNS server for team02
  lineinfile:
    path: /etc/resolv.conf
    state: present
    line: "nameserver 10.0.2.1"
  when: "'team02' in ansible_limit"

- name: Set alternate DNS server for both teams
  lineinfile:
    path: /etc/resolv.conf
    state: present
    line: "nameserver 8.8.8.8"

- name: Configure /etc/hosts file for team01
  lineinfile:
    path: /etc/hosts
    state: present
    line: "{{ item }}"
  when: "'team01' in ansible_limit"
  loop:
    - "10.0.1.1 giganotosaurus1.jp1.local"
    - "192.168.1.89 brachiosaurus1.jp1.local"
    - "192.168.1.109 stegosaurus1.jp1.local"
    - "192.168.1.12 triceratops1.jp1.local"
    - "10.0.1.77 allosaurus1.jp1.local"

- name: Configure /etc/hosts file for team02
  lineinfile:
    path: /etc/hosts
    state: present
    line: "{{ item }}"
  when: "'team02' in ansible_limit"
  loop:
    - "10.0.2.1 giganotosaurus2.jp2.local"
    - "192.168.2.89 brachiosaurus2.jp2.local"
    - "192.168.2.109 stegosaurus2.jp2.local"
    - "192.168.2.12 triceratops2.jp2.local"
    - "10.0.2.77 allosaurus2.jp2.local"
