---
- name: Install Graylog on Debian 11
  hosts: localhost
  become: true
  tasks:

    # update apt cache
    - name: Update apt cache
      apt:
        update_cache: yes

    # Install dependencies
    - name: Install required dependencies
      apt:
        name:
          - openjdk-11-jre-headless
          - apt-transport-https
          - wget
          - curl
          - gnupg
          - lsb-release
        state: present

    # Add Graylog repository
    - name: Add Graylog repository
      apt:
        deb: "https://packages.graylog2.org/repo/packages/graylog-2.4-repository_latest.deb"
        update_cache: true
        state: present


    # Install Graylog package
    - name: Install Graylog
      apt: 
        name: "graylog-server"
        state: present

    # MongoDB
    #- name: MongoDB key installation
    #  shell: |
