    # Enable and start MongoDB service
    #- name: Ensure MongoDB is running
    #  service:
    #    name: mongodb
    #    state: started
    #    enabled: yes


    # Install and configure Elasticsearch
    - name: Install Elasticsearch
      apt: 
        name: elasticsearch
        state: present


    # Enable and start Elasticsearch service
    - name: Ensure Elasticsearch is running
      service:
        name: elasticsearch
        state: started
        enabled: yes


    # Enable and start Graylog service
    - name: Enable and start Graylog service
      service:
        name: graylog-server
        state: started
        enabled: yse

    # configure Graylog server
    - name: Set the password secret in Graylog configuration
      lineinfile:
        path: /etc/graylog/server/server.conf
        regexp: '^#password_secret ='
        line: 'password_secret = {{ lookup("passwordstore", "graylog_password_secret") }}'

    - name: Set the root password hash in Graylog configuration
      lineinfile:
        path: /etc/graylog/server/server.conf
        regexp: '^#root_password_sha2 ='
        line: 'root_password_sha2 = {{ lookup("passwordstore", "graylog_root_password") }}'


    - name: Set the web interface listen address in Graylog configuration
      lineinfile:
        path: /etc/graylog/server/server.conf
        regexp: '^#web_listen_uri ='
        line: 'web_listen_uri = http://0.0.0.0:9000/'


    - name: Set the rest listen address in Graylog configuration
      lineinfile:
        path: /etc/graylog/server/server.conf
        regexp: '^#rest_listen_uri ='
        line: 'rest_listen_uri = http://0.0.0.0:12900/'


    - name: Set the Elasticsearch cluster name in Graylog configuration
      lineinfile:
        path: /etc/graylog/server/server.conf
        regexp: '^#elasticsearch_cluster_name ='
        line: 'elasticsearch_cluster_name = graylog'

    # Restart Graylog to apply the changes
    - name: Restart Graylog service
      service:
        name: graylog-server
        state: restarted
